version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: wuzi-mysql
    environment:
      # root 仅用于容器初始化；业务连接使用 WUZI_DB_USER 指定的普通账号
      MYSQL_ROOT_PASSWORD: ${WUZI_DB_ROOT_PASSWORD:?WUZI_DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: wuzi_test
      MYSQL_USER: ${WUZI_DB_USER:?WUZI_DB_USER is required}
      MYSQL_PASSWORD: ${WUZI_DB_PASSWORD:?WUZI_DB_PASSWORD is required}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - wuzi-mysql-data:/var/lib/mysql
      # 统一初始化 SQL（结构 + 种子 + 全部补丁效果），一次挂载即可；
      # 历史增量补丁归档于 sql/patches/（已有旧库升级用）
      - ./sql/wuzi_full.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: wuzi-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WUZI_DB_URL: jdbc:mysql://mysql:3306/wuzi_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      WUZI_DB_USER: ${WUZI_DB_USER:?WUZI_DB_USER is required}
      WUZI_DB_PASSWORD: ${WUZI_DB_PASSWORD:?WUZI_DB_PASSWORD is required}
      WUZI_JWT_SECRET: ${WUZI_JWT_SECRET:?WUZI_JWT_SECRET is required (>=32 chars)}
      WUZI_CORS_ORIGINS: ${WUZI_CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - wuzi-attachments:/app/data/attachments
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    image: nginx:alpine
    container_name: wuzi-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  wuzi-mysql-data:
  wuzi-attachments:
