name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  arch-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Architecture / security static gates
        run: python scripts/check_arch.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend tests (includes PermContract + Stock + Tax)
        working-directory: backend
        env:
          WUZI_JWT_SECRET: ci-only-jwt-secret-must-be-at-least-32-bytes-long
          WUZI_DB_PASSWORD: ci
        run: mvn -B test
      - name: API alignment audit
        run: python scripts/audit_api_alignment.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PC frontend build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
      - name: Mobile frontend build
        working-directory: frontend/mobile
        run: |
          npm ci || npm install
          npm run build
      - name: Perm codes module syntax check
        working-directory: frontend
        run: node --check src/utils/perm-codes.js
